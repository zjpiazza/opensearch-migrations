name: Bazel experiment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    if: github.repository == 'zjpiazza/opensearch-migrations'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Bazel and experiment caches
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          # Unique namespace guarantees this job starts without cached test results.
          # The dependent job restores this exact cache on a fresh runner.
          disk-cache: experiment-${{ github.run_id }}-${{ github.run_attempt }}
          cache-save: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Check dependency pins
        run: python3 tools/build/bazel/check_dependencies.py
      - name: Measure execution, reuse and fixture invalidation
        run: python3 tools/build/bazel/ci_benchmark.py
      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-execution-evidence
          path: |
            build/bazel-ci-results/
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          retention-days: 14

  restored:
    needs: execute
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Bazel caches on a fresh runner
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: experiment-${{ github.run_id }}-${{ github.run_attempt }}
          cache-save: false
      - name: Measure restored results
        run: python3 tools/build/bazel/ci_benchmark.py --restored
      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-restored-evidence
          path: |
            build/bazel-ci-results/
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          retention-days: 14
