# Native nftables avoids iptables-nft restore buffer failures on rootless Docker.
# This applies only to disposable benchmark clusters, not Jenkins or the host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  kubeProxyMode: nftables
nodes:
  - role: control-plane
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
